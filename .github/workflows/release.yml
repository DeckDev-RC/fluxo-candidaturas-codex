name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Checksum e SBOM
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/VERSION -Raw).Trim()
          $installer = "apps/desktop/dist/desktop/Fluxo-$version-Windows-x64.exe"
          (Get-FileHash -Algorithm SHA256 $installer).Hash + "  " + (Split-Path $installer -Leaf) |
            Set-Content "apps/desktop/dist/desktop/SHA256SUMS.txt"
          npm sbom --workspace @deckdev-rc/fluxo-desktop --sbom-format cyclonedx |
            Set-Content "apps/desktop/dist/desktop/sbom.cdx.json"

      - name: Atestar instalador
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/desktop/dist/desktop/Fluxo-*-Windows-x64.exe

      - name: Publicar ativos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --title "Fluxo ${{ github.ref_name }}"
          }
          gh release upload "${{ github.ref_name }}" `
            apps/desktop/dist/desktop/Fluxo-*-Windows-x64.exe `
            apps/desktop/dist/desktop/Fluxo-*-Windows-x64.exe.blockmap `
            apps/desktop/dist/desktop/SHA256SUMS.txt `
            apps/desktop/dist/desktop/sbom.cdx.json `
            --clobber
