<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluxo — sua busca de emprego</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/components.css" />
</head>
<body>
  <a class="pular-para-conteudo" href="#conteudo">Ir para o conteúdo</a>

  <div class="aplicacao">
    <div class="navegacao">
      <p class="marca">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false">
          <path d="M3 16.5C6.5 16.5 6.5 5.5 11 5.5s4.5 11 8 11" fill="none" stroke="#b44832" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="19" cy="16.5" r="2.2" fill="#20262b" />
        </svg>
        Fluxo
      </p>

      <nav aria-label="Áreas do Fluxo">
        <ul id="navegacao-principal">
          <li><a href="#agora" data-rota="agora">Agora</a></li>
          <li><a href="#oportunidades" data-rota="oportunidades">Oportunidades</a></li>
          <li><a href="#candidaturas" data-rota="candidaturas">Candidaturas</a></li>
          <li><a href="#perfil" data-rota="perfil">Meu perfil</a></li>
        </ul>
      </nav>

      <div class="navegacao-rodape">
        <a href="#configuracoes" data-rota="configuracoes">Configurações</a>
        <a href="#ajuda" data-rota="ajuda">Ajuda</a>
      </div>
    </div>

    <div class="coluna-trabalho">
      <header class="cabecalho">
        <div class="objetivo-ativo">
          <span class="etiqueta">objetivo ativo</span>
          <strong id="objetivo-texto">Carregando…</strong>
          <span class="apoio" id="estado-trabalho">Lendo os dados deste computador</span>
        </div>
        <div class="cabecalho-acoes">
          <a class="contador-decisoes" id="indicador-decisoes" href="#decisoes" data-vazio="true">
            <span id="indicador-decisoes-texto">Nenhuma decisão pendente</span>
          </a>
          <button class="botao-secundario botao" id="editar-objetivo" type="button">Mudar objetivo</button>
          <button class="botao-secundario botao" id="atualizar" type="button">Atualizar</button>
        </div>
      </header>

      <main id="conteudo" class="area" tabindex="-1">
        <div class="regiao-mensagens" id="mensagens" role="status" aria-live="polite"></div>
        <div id="tela"></div>
      </main>

      <form class="conversa" id="conversa" aria-label="Falar com o Fluxo">
        <label class="apenas-leitor" for="conversa-texto">Pergunte ou ajuste seu objetivo</label>
        <input id="conversa-texto" name="mensagem" type="text" placeholder="Pergunte ou ajuste seu objetivo. Ex.: quero apenas vagas remotas" autocomplete="off" />
        <button class="botao" type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <dialog id="dialogo">
    <h2 id="dialogo-titulo"></h2>
    <div id="dialogo-corpo"></div>
    <div class="dialogo-acoes" id="dialogo-acoes"></div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
